<form method="post" action="index.cgi">
  <input type="hidden" name="form" value="settings">
  <div class="lb-actions">
    <button type="submit" class="lb-btn" name="aktion" value="abmelden" <TMPL_VAR NUR_MIT_SERVER>><TMPL_VAR FM.BTN_ABMELDEN></button>
  </div>

<script>
(function () {
    "use strict";

    // ---------------------------------------------------------------------
    // Sternchen verschwinden beim Hineinklicken
    //
    // Sie sind eine Anzeige ("ein Passwort ist gesetzt"), kein Inhalt - das
    // echte Passwort steht nirgends, gespeichert ist nur der daraus
    // abgeleitete Schluessel. Wer ins Feld klickt, will tippen; er soll
    // nicht erst eine Reihe Sterne loeschen muessen.
    // ---------------------------------------------------------------------
    document.addEventListener("focusin", function (e) {
        var feld = e.target;
        if (feld && feld.id === "tp_pw" && /^\*+$/.test(feld.value)) {
            feld.value = "";
        }
    });

    // ---------------------------------------------------------------------
    // Der Umschalter fuer die Fernwartung - sofort, ohne Neuaufbau
    //
    // Er aendert genau ein Feld in einer Datei. Die Seite dafuer komplett neu
    // erzeugen zu lassen kostete rund eine Sekunde: Dabei wird auch die
    // Ordnerauswahl neu gebaut, und die holt ihre Liste per HTTP vom eigenen
    // Webserver. Bei einem Schalter, der sich sofort bewegt, wirkt diese
    // Sekunde wie ein Fehler.
    //
    // Deshalb: Die abhaengigen Felder werden SOFORT gesperrt oder
    // freigegeben, und das Speichern laeuft daneben. Kommt es durch, ist
    // ohnehin schon alles richtig; scheitert es, geht der Schalter zurueck.
    var riegelLaeuft = null;

    window.fmRiegel = function (schalter) {
        var form = schalter.form;
        var an = schalter.checked;

        riegelAnzeigen(an);

        // Eine noch laufende Anfrage abbrechen: Wer zweimal schnell klickt,
        // soll das Ergebnis des ZWEITEN Klicks sehen, nicht das des ersten,
        // das zufaellig spaeter ankommt.
        if (riegelLaeuft) { riegelLaeuft.abort(); }
        riegelLaeuft = new AbortController();

        var daten = new FormData(form);
        daten.append("aktion", an ? "tunnel_erlaubt_ein" : "tunnel_erlaubt_aus");

        fetch(form.action, {
            method: "POST", body: daten, credentials: "same-origin",
            headers: { "X-FM-Fetch": "1" }, signal: riegelLaeuft.signal
        })
        .then(function () { riegelLaeuft = null; })
        .catch(function (f) {
            if (f && f.name === "AbortError") { return; }
            riegelLaeuft = null;
            schalter.checked = !an;
            riegelAnzeigen(!an);
        });
    };

    // Was am Riegel haengt: das Passwort. Ist er zu, gibt es nichts zu
    // vergeben. Die Regel steht hier UND im Perl-Code - hier fuer die
    // sofortige Anzeige, dort fuer den naechsten Seitenaufbau und gegen eine
    // Anfrage, die von Hand geschickt wird.
    function riegelAnzeigen(an) {
        var stuecke = [document.getElementById("tp_pw")];
        var knoepfe = document.querySelectorAll("[name=aktion][value=vorschlag], [name=aktion][value=setzen]");
        for (var i = 0; i < knoepfe.length; i++) { stuecke.push(knoepfe[i]); }
        for (var j = 0; j < stuecke.length; j++) {
            if (stuecke[j]) { stuecke[j].disabled = !an; }
        }
        var text = document.getElementById("fm-zugriff-text");
        if (text) { text.textContent = an ? text.dataset.an : text.dataset.aus; }
    }

    // ---------------------------------------------------------------------
    // Speichern ohne Neuladen
    //
    // Vorher wurde das Formular normal abgeschickt: Der Browser lud die Seite
    // neu, zeigte sie oben an, und ein Skript scrollte danach zurueck. Genau
    // dieses Nachscrollen war das sichtbare Zucken - es kann gar nicht anders
    // aussehen, denn es geschieht NACH dem Rendern.
    //
    // Jetzt geht der Inhalt per fetch raus, und nur die Karte im Dokument
    // wird ausgetauscht. Die Seite bleibt stehen, wo sie steht: Es gibt
    // nichts zurueckzuscrollen, weil nie gesprungen wurde.
    //
    // Ohne JavaScript senden die Formulare weiterhin normal - dann laedt die
    // Seite neu und beginnt oben. Vollstaendig bedienbar, nur weniger ruhig.
    // ---------------------------------------------------------------------
    function austauschen(html) {
        var neu = new DOMParser().parseFromString(html, "text/html");

        // Die beiden Teile, die sich aendern koennen: das Zustandsschild oben
        // und die Karte mit allem Inhalt. Der Rest der Seite (Kopf, Reiter,
        // Fuss) bleibt unberuehrt - er kommt ohnehin unveraendert zurueck.
        var paare = [[".fm-zustand", ".fm-zustand"], [".lb-card", ".lb-card"]];
        for (var i = 0; i < paare.length; i++) {
            var alt = document.querySelector(paare[i][0]);
            var frisch = neu.querySelector(paare[i][1]);
            if (alt && frisch) { alt.replaceWith(frisch); }
        }
        skripteNachziehen();
    }

    // Ein per innerHTML/replaceWith eingesetztes <script> fuehrt der Browser
    // NICHT aus. Das betrifft hier nur den Storage-Waehler, der sich selbst
    // fuellt - ohne diesen Schritt bliebe seine Auswahl nach dem Speichern
    // leer und der Betreiber haette den Eindruck, sie sei verlorengegangen.
    function skripteNachziehen() {
        var karte = document.querySelector(".lb-card");
        if (!karte) { return; }
        var skripte = karte.querySelectorAll("script");
        for (var i = 0; i < skripte.length; i++) {
            var neu = document.createElement("script");
            if (skripte[i].src) { neu.src = skripte[i].src; }
            else { neu.textContent = skripte[i].textContent; }
            skripte[i].replaceWith(neu);
        }
    }

    // Delegation am Dokument, nicht am einzelnen Formular: Nach dem Austausch
    // sind die Formulare andere Elemente - ein Handler an ihnen waere weg.
    var laufend = null;

    document.addEventListener("submit", function (e) {
        var form = e.target;
        if (!form || form.tagName !== "FORM") { return; }
        // Nur unsere eigenen Formulare. Fremde (etwa aus dem Storage-Waehler)
        // sollen ihren gewohnten Weg gehen.
        if (!form.closest(".lb-card")) { return; }

        e.preventDefault();

        var daten = new FormData(form);
        // Ein FormData nimmt den Knopf, mit dem gesendet wurde, NICHT auf -
        // und genau der traegt hier die Aktion ("aktion=setzen"). Ohne diese
        // Zeile kaeme beim Server ein Aufruf ohne Aktion an, und es geschaehe
        // schlicht nichts.
        var knopf = e.submitter;
        if (knopf && knopf.name) { daten.append(knopf.name, knopf.value); }

        // Eine noch laufende Anfrage abbrechen - sonst ueberschreibt eine
        // spaet eintreffende alte Antwort das Ergebnis der neuen, und die
        // Seite zeigt einen Stand, den es nie gab.
        if (laufend) { laufend.abort(); }
        laufend = new AbortController();

        fetch(form.action, {
            signal: laufend.signal,
            method: "POST",
            body: daten,
            credentials: "same-origin",
            // Damit der Server weiss, dass er NICHT umleiten soll: Diese
            // Anfrage aendert die Chronik nicht, ein 303 waere hier nur ein
            // ueberfluessiger zweiter Aufruf.
            headers: { "X-FM-Fetch": "1" }
        })
            .then(function (a) { return a.text(); })
            .then(function (html) { laufend = null; austauschen(html); })
            .catch(function (f) {
                if (f && f.name === "AbortError") { return; }
                // Geht der Weg ueber fetch schief, wird normal abgeschickt -
                // lieber ein Neuladen als ein Knopf, der nichts tut.
                form.submit();
            });
    });

    // ---------------------------------------------------------------------
    // Das Fenster fuer den Verbindungstest
    //
    // Am Dokument statt am Knopf, aus demselben Grund: Nach einem Austausch
    // ist der Knopf ein anderes Element.
    // ---------------------------------------------------------------------
    document.addEventListener("click", function (e) {
        var ziel = e.target.closest ? e.target.closest("#fm-test-knopf, #fm-test-schliessen") : null;
        if (!ziel) { return; }

        var fenster = document.getElementById("fm-test-fenster");
        var ausgabe = document.getElementById("fm-test-ausgabe");
        if (!fenster || !ausgabe) { return; }

        if (ziel.id === "fm-test-schliessen") { fenster.style.display = "none"; return; }
        if (ziel.disabled) { return; }

        ausgabe.textContent = "";
        fenster.style.display = "flex";

        // Der Test laeuft als Datenstrom: Jede Zeile erscheint, sobald sie da
        // ist. Ohne das Mitlesen saehe man mehrere Sekunden nichts und danach
        // alles auf einmal - und wuesste bei einem Haenger nicht, wie weit es
        // gekommen war.
        fetch("index.cgi?ajax=pruefen", { credentials: "same-origin" })
            .then(function (antwort) {
                if (!antwort.body || !antwort.body.getReader) {
                    return antwort.text().then(function (t) { ausgabe.textContent = t; });
                }
                var leser = antwort.body.getReader();
                var dekoder = new TextDecoder("utf-8");
                return (function weiter() {
                    return leser.read().then(function (stueck) {
                        if (stueck.done) { return; }
                        ausgabe.textContent += dekoder.decode(stueck.value, { stream: true });
                        ausgabe.scrollTop = ausgabe.scrollHeight;
                        return weiter();
                    });
                })();
            })
            .catch(function (fehler) { ausgabe.textContent += "\n" + fehler; });
    });

    document.addEventListener("click", function (e) {
        var fenster = document.getElementById("fm-test-fenster");
        if (fenster && e.target === fenster) { fenster.style.display = "none"; }
    });
    document.addEventListener("keydown", function (e) {
        var fenster = document.getElementById("fm-test-fenster");
        if (e.key === "Escape" && fenster && fenster.style.display !== "none") {
            fenster.style.display = "none";
        }
    });
})();
</script>

</div>
