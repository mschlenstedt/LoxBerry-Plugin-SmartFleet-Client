/* Popup fuer das Ergebnis einer Aktion (Kopplung, Abmelden, Tunnel-Passwort,
   ...) - zusaetzlich zum Kasten, der ohnehin an Ort und Stelle im Formular
   stehen bleibt. Der Kasten alleine liess sich zu leicht uebersehen (Kopplung
   scheiterte, ohne dass etwas auffiel).

   lb-modal ist die Popup-Komponente des Design Systems selbst (natives
   <dialog>, components.css) - dasselbe Muster wie das Testmail-Fenster in
   templates/system/mailserver.html des Cores: showModal()/close(), keine
   eigene Overlay-Mechanik. Zentriert sich selbst, sperrt den Hintergrund
   (::backdrop) und bleibt offen, bis der Schliessen-Knopf (oder Esc) es
   schliesst - kein Selbst-Zuklappen nach einer Frist. */
.fm-popup-titel {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    font-size: 1.15rem;
}
.fm-popup-titel .pi { font-size: 1.4rem; }
.fm-popup-erfolg .pi { color: var(--lb-success, #2e7d32); }
.fm-popup-fehler .pi { color: var(--lb-danger, #c62828); }
</style>

<script>
(function () {
    "use strict";

    var SPEICHER = "securePIN";

    function pinLesen() {
        try { return sessionStorage.getItem(SPEICHER); } catch (e) { return null; }
    }
    function pinMerken(wert) {
        try { sessionStorage.setItem(SPEICHER, wert); } catch (e) { }
    }
    function pinVergessen() {
        try { sessionStorage.removeItem(SPEICHER); } catch (e) { }
    }

    function pinPruefen() {
        var feld  = document.getElementById("securepin");
        var hint  = document.getElementById("check_hint");
        var knopf = document.getElementById("check_securepin");
        var block = document.getElementById("securepin_block");
        if (!feld || !feld.value) { zeigen(); return; }

        function melden(text, farbe) {
            if (!hint) { return; }
            hint.textContent = text;
            hint.style.color = farbe;
        }
        function zeigen() {
            if (block) { block.style.visibility = ""; }
        }

        if (knopf) { knopf.disabled = true; }
        melden(hint ? hint.dataset.wait : "", "blue");

        var daten = new FormData();
        daten.append("ajax", "pin");
        daten.append("secpin", feld.value);

        fetch("index.cgi", { method: "POST", body: daten, credentials: "same-origin" })
            .then(function (a) { return a.json(); })
            .then(function (j) {
                if (j && j.ok && j.schein) {
                    pinMerken(feld.value);
                    location.replace("index.cgi?form=settings&schein=" + encodeURIComponent(j.schein));
                    return;
                }

                pinVergessen();
                feld.value = "";
                if (knopf) { knopf.disabled = false; }
                zeigen();
                melden(hint ? (j && j.gesperrt ? hint.dataset.locked : hint.dataset.wrong) : "", "red");
            })
            .catch(function () {
                if (knopf) { knopf.disabled = false; }
                zeigen();
                melden(hint ? hint.dataset.generic : "", "red");
            });
    }

    document.addEventListener("click", function (e) {
        var ziel = e.target.closest ? e.target.closest("#check_securepin") : null;
        if (ziel) { pinPruefen(); }
    });

    if (document.getElementById("securepin") && pinLesen()) {
        pinPruefen();
    }

    document.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && e.target && e.target.id === "securepin") {
            e.preventDefault();
            var k = document.getElementById("check_securepin");
            if (k) { k.click(); }
        }
    });

    document.addEventListener("click", function (e) {
        var ziel = e.target.closest
                 ? e.target.closest("#fm-trennen-knopf, #fm-trennen-ja, #fm-trennen-nein")
                 : null;
        if (!ziel) { return; }
        var fenster = document.getElementById("fm-trennen-fenster");
        if (!fenster) { return; }

        if (ziel.id === "fm-trennen-knopf") {
            if (ziel.disabled) { return; }
            fenster.style.display = "flex";
            var nein = document.getElementById("fm-trennen-nein");
            if (nein) { nein.focus(); }
            return;
        }
        fenster.style.display = "none";
        if (ziel.id !== "fm-trennen-ja") { return; }

        var form = document.getElementById("fm-trennen-form");
        if (!form) { return; }
        var k = document.createElement("input");
        k.type = "hidden"; k.name = "aktion"; k.value = "abmelden";
        form.appendChild(k);
        if (form.requestSubmit) { form.requestSubmit(); } else { form.submit(); }
    });

    document.addEventListener("keydown", function (e) {
        var f = document.getElementById("fm-trennen-fenster");
        if (e.key === "Escape" && f && f.style.display !== "none") { f.style.display = "none"; }
    });

    document.addEventListener("focusin", function (e) {
        var feld = e.target;
        if (feld && feld.id === "tp_pw" && /^\*+$/.test(feld.value)) {
            feld.value = "";
        }
    });

    var riegelLaeuft = null;

    window.fmRiegel = function (schalter) {
        var form = schalter.form;
        var an = schalter.checked;

        riegelAnzeigen(an);

        if (riegelLaeuft) { riegelLaeuft.abort(); }
        riegelLaeuft = new AbortController();

        var daten = new FormData(form);
        daten.set("aktion", an ? "tunnel_erlaubt_ein" : "tunnel_erlaubt_aus");

        fetch(form.action, {
            method: "POST", body: daten, credentials: "same-origin",
            headers: { "X-FM-Fetch": "1" }, signal: riegelLaeuft.signal
        })
        .then(function () { riegelLaeuft = null; })
        .catch(function (f) {
            if (f && f.name === "AbortError") { return; }
            riegelLaeuft = null;
            schalter.checked = !an;
            riegelAnzeigen(!an);
        });
    };

    function riegelAnzeigen(an) {
        var stuecke = [document.getElementById("tp_pw")];
        var knoepfe = document.querySelectorAll("[name=aktion][value=vorschlag], [name=aktion][value=setzen]");
        for (var i = 0; i < knoepfe.length; i++) { stuecke.push(knoepfe[i]); }
        for (var j = 0; j < stuecke.length; j++) {
            if (stuecke[j]) { stuecke[j].disabled = !an; }
        }
        var text = document.getElementById("fm-zugriff-text");
        if (text) { text.textContent = an ? text.dataset.an : text.dataset.aus; }
    }

    function austauschen(html) {
        var neu = new DOMParser().parseFromString(html, "text/html");

        var paare = [[".fm-zustand", ".fm-zustand"], [".lb-card", ".lb-card"]];
        for (var i = 0; i < paare.length; i++) {
            var alt = document.querySelector(paare[i][0]);
            var frisch = neu.querySelector(paare[i][1]);
            if (alt && frisch) { alt.replaceWith(frisch); }
        }
        skripteNachziehen();
        zeigePopups();
    }

    function zeigePopups() {
        var quellen = document.querySelectorAll(".fm-popup-quelle");
        for (var i = 0; i < quellen.length; i++) {
            var el = quellen[i];
            if (el.dataset.fmPopupGezeigt) { continue; }
            el.dataset.fmPopupGezeigt = "1";
            zeigePopup(el.textContent.trim(), el.dataset.fmOk === "1");
            break;
        }
    }

    function zeigePopup(text, erfolg) {
        if (!text) { return; }
        var dialog = document.getElementById("fm-popup");
        if (!dialog || typeof dialog.showModal !== "function") { return; }

        dialog.classList.toggle("fm-popup-erfolg", erfolg);
        dialog.classList.toggle("fm-popup-fehler", !erfolg);
        document.getElementById("fm-popup-icon").className = "pi " + (erfolg ? "pi-check-circle" : "pi-times-circle");
        document.getElementById("fm-popup-titeltext").textContent =
            erfolg ? dialog.dataset.titelErfolg : dialog.dataset.titelFehler;
        document.getElementById("fm-popup-text").textContent = text;

        dialog.showModal();
    }

    function skripteNachziehen() {
        var karte = document.querySelector(".lb-card");
        if (!karte) { return; }
        var skripte = karte.querySelectorAll("script");
        for (var i = 0; i < skripte.length; i++) {
            var neu = document.createElement("script");
            if (skripte[i].src) { neu.src = skripte[i].src; }
            else { neu.textContent = skripte[i].textContent; }
            skripte[i].replaceWith(neu);
        }
    }

    var laufend = null;

    document.addEventListener("submit", function (e) {
        var form = e.target;
        if (!form || form.tagName !== "FORM") { return; }
        if (!form.closest(".lb-card")) { return; }

        e.preventDefault();

        var daten = new FormData(form);
        var knopf = e.submitter;
        if (knopf && knopf.name) { daten.set(knopf.name, knopf.value); }

        if (laufend) { laufend.abort(); }
        laufend = new AbortController();

        fetch(form.action, {
            signal: laufend.signal,
            method: "POST",
            body: daten,
            credentials: "same-origin",
            headers: { "X-FM-Fetch": "1" }
        })
            .then(function (a) { return a.text(); })
            .then(function (antwort) {
                laufend = null;

                var was = daten.get("aktion");
                if (was === "enroll" || was === "abmelden") {
                    var ziel = "index.cgi?form=settings&schein="
                        + encodeURIComponent(daten.get("schein") || "");
                    try {
                        var m = JSON.parse(antwort);
                        if (m && m.mo) {
                            ziel += "&mo=" + encodeURIComponent(m.mo)
                                 +  "&mk=" + (m.mk ? "1" : "0")
                                 +  "&ms=" + encodeURIComponent(m.ms || "");
                        }
                    } catch (fehler) {
                    }
                    location.replace(ziel);
                    return;
                }

                austauschen(antwort);
            })
            .catch(function (f) {
                if (f && f.name === "AbortError") { return; }
                form.submit();
            });
    });

    document.addEventListener("click", function (e) {
        var ziel = e.target.closest ? e.target.closest("#fm-test-knopf, #fm-test-schliessen") : null;
        if (!ziel) { return; }

        var fenster = document.getElementById("fm-test-fenster");
        var ausgabe = document.getElementById("fm-test-ausgabe");
        if (!fenster || !ausgabe) { return; }

        if (ziel.id === "fm-test-schliessen") { fenster.style.display = "none"; return; }
        if (ziel.disabled) { return; }

        ausgabe.textContent = "";
        fenster.style.display = "flex";

        var schein = (document.querySelector("input[name=schein]") || {}).value || "";

        fetch("index.cgi?ajax=pruefen&schein=" + encodeURIComponent(schein),
              { credentials: "same-origin" })
            .then(function (antwort) {
                if (!antwort.body || !antwort.body.getReader) {
                    return antwort.text().then(function (t) { ausgabe.textContent = t; });
                }
                var leser = antwort.body.getReader();
                var dekoder = new TextDecoder("utf-8");
                return (function weiter() {
                    return leser.read().then(function (stueck) {
                        if (stueck.done) { return; }
                        ausgabe.textContent += dekoder.decode(stueck.value, { stream: true });
                        ausgabe.scrollTop = ausgabe.scrollHeight;
                        return weiter();
                    });
                })();
            })
            .catch(function (fehler) { ausgabe.textContent += "\n" + fehler; });
    });

    document.addEventListener("click", function (e) {
        var fenster = document.getElementById("fm-test-fenster");
        if (fenster && e.target === fenster) { fenster.style.display = "none"; }
    });
    document.addEventListener("keydown", function (e) {
        var fenster = document.getElementById("fm-test-fenster");
        if (e.key === "Escape" && fenster && fenster.style.display !== "none") {
            fenster.style.display = "none";
        }
    });

    zeigePopups();
})();
</script>

</div>
</div>
