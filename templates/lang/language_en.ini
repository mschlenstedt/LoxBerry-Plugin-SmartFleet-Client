; --- Password vault -------------------------------------------------------
VAULT_TITEL="Password vault"
VAULT_HINWEIS="Here you decide whether this LoxBerry may transfer passwords to the server in encrypted form."
VAULT_STATUS_LABEL="Transfer to the vault:"
VAULT_STATUS_AKTIV="active since"
VAULT_STATUS_INAKTIV="not active"
VAULT_BTN_AKTIVIEREN="Activate"
VAULT_BTN_WIDERRUFEN="Revoke"
VAULT_BTN_PIN_RESET="Reset vault key"
VAULT_PIN_RESET_TITEL="Really reset the vault key?"
VAULT_PIN_RESET_TEXT="The LoxBerry forgets the vault key of the server it remembered so far and accepts the current one at the next contact. This is only necessary if the vault was created anew on the server."
VAULT_PIN_RESET_JA="Yes, reset"
VAULT_WIDERRUF_TITEL="Really revoke the transfer?"
VAULT_WIDERRUF_TEXT="The transfer ends and all entries stored for this site (Miniserver and tunnel passwords) are deleted on the server. Passwords that have already been retrieved cannot be unseen. Activating again requires new consent."
VAULT_WIDERRUF_JA="Yes, revoke"
VAULT_WIDERRUF_NEIN="Cancel"
VAULT_PIN_RESET_NEIN="Cancel"
VAULT_MELDUNG_OPTIN="The transfer to the vault is activated."
VAULT_MELDUNG_OPTIN_HINWEIS="Passwords that were already set (tunnel password) are not transferred retroactively; please set the tunnel password again so that it ends up in the vault. Miniserver passwords are transferred automatically."
VAULT_MELDUNG_WIDERRUF="The transfer has been revoked. The entries stored for this site are deleted on the server."
VAULT_MELDUNG_PIN="The vault key has been reset. At the next contact the LoxBerry accepts the current key of the server."
VAULT_MELDUNG_HAKEN="Nothing was activated because the checkbox was not confirmed."
VAULT_MELDUNG_FEHLER="The setting could not be saved."
NICHT_UEBERTRAGEN="The password could not be transferred to the vault (no vault key from the server yet). Please set it again after the first contact."

VAULT_POPUP_TITEL="Transfer passwords to the server in encrypted form?"
VAULT_POPUP_INTRO="If you agree, this plugin sends the following passwords of this site to the SmartFleet server it is connected to:"
VAULT_POPUP_PUNKT_1="the passwords of the Miniservers - automatically again with every change"
VAULT_POPUP_PUNKT_2="the tunnel password for remote access to this LoxBerry, as soon as it is set"
VAULT_POPUP_WIE_TITEL="How it works:"
VAULT_POPUP_WIE="The passwords are encrypted here on the LoxBerry with the public key of this site's vault before they leave the LoxBerry. Only encrypted data is stored on the server; even the server cannot read it. Only someone who knows the master password of this vault and is authorised for this site can decrypt it."
VAULT_POPUP_BEACHTEN_TITEL="Please note:"
VAULT_POPUP_RISIKO_1="Whoever obtains one of these passwords gains access to the respective Miniserver or this LoxBerry: changing settings, switching outputs, viewing data."
VAULT_POPUP_RISIKO_2="The procedure is designed to be secure by today's state of the art. There is no such thing as complete security; it also depends on the master password and on the devices of those who know it."
VAULT_POPUP_RISIKO_3_A="The transfer takes place"
VAULT_POPUP_RISIKO_3_B="at your own risk"
VAULT_POPUP_RISIKO_3_C=". For this function, no warranty and no liability is accepted, to the extent permitted by law. Mandatory statutory liability, for example in case of intent, remains unaffected."
VAULT_POPUP_RISIKO_4="You can revoke at any time: the transfer ends, and the entries stored for this site are deleted on the server. Passwords that have already been retrieved are not unseen by this; if in doubt, they must be changed on the Miniserver."
VAULT_POPUP_HAKEN="I have read the notice and accept the risk. I agree to the transfer."
VAULT_POPUP_ABBRECHEN="Cancel"
VAULT_POPUP_ZUSTIMMEN="Agree"
