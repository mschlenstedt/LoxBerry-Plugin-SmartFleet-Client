<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SmartFleet Client">
<title>SmartFleet Client</title>
<!--
  SmartFleet Client

  Der Miniserver ist die Zeichnung aus dem Icon main_miniserver.svg des
  LoxBerry-Cores, unveraendert uebernommen: nur der Hintergrund des
  Originals ist entfernt und die Zeichnung neu platziert. Farben,
  Proportionen und jede Klemme stammen von dort.

  Platziert wird nicht nach Augenmass - das Original verschachtelt
  translate() und matrix() ueber drei Ebenen. Ausgerechnet ist die Zeichnung
  61,541 x 33,129 Einheiten gross, ihre Mitte liegt bei (31,941 / 32,552).

  KEIN RAHMEN UM DAS GERAET. Das Gehaeuse (#83b819) hebt sich vom Grund
  (#49DE80) nur mit 1,36 : 1 ab; die Form tragen die grauen Klemmleisten und
  der Beschriftungsbalken. Ein dunkler Rand haette den Kontrast geloest und
  ausgesehen wie ein Bildschirmrahmen.

  Grund und Eckradius folgen dem Smartmeter-Plugin, damit die Icons
  desselben Autors als Familie erkennbar bleiben.
-->
